[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snap-go"
version = "0.2.0"
description = "Reliability-first Raspberry Pi + ESP32-S3 two-axis subject tracker for ArduRover"
requires-python = ">=3.11"
dependencies = ["flask>=3.0,<4", "pyserial>=3.5,<4"]

[project.optional-dependencies]
vision = ["opencv-python-headless>=4.10,<5", "ultralytics>=8.3,<9"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
snap-go = "snap_go.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
