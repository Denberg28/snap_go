[build-system]
requires = ["setuptools==84.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"
[project]
name = "snap-go"
version = "0.10.0"
license = {file = "LICENSE"}
description = "Local YOLOv8n camera pan/tilt controller for Raspberry Pi and ESP32-S3"
requires-python = ">=3.10,<3.13"
dependencies = ["pyserial==3.5"]
[project.optional-dependencies]
vision = ["ultralytics==8.4.31", "numpy==2.2.6", "opencv-python==4.13.0.92", "torch==2.13.0", "torchvision==0.28.0"]
ncnn = ["ncnn==1.0.20260114"]
dev = ["pytest==8.3.5", "build==1.2.2.post1"]
[project.scripts]
snap-go = "snap_go.app:main"
[tool.setuptools.packages.find]
include = ["snap_go*"]
[tool.setuptools.package-data]
snap_go = ["static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
