name: Android debug APK
on:
  workflow_dispatch:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Verify release signing path with disposable CI key
        working-directory: android
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci-test.jks" -alias snapgo \
            -storepass ci-only-password -keypass ci-only-password -dname "CN=Snap Go CI" \
            -keyalg RSA -keysize 2048 -validity 1 -noprompt
          SNAP_GO_KEYSTORE_FILE="$RUNNER_TEMP/ci-test.jks" SNAP_GO_SIGNING_PASSWORD=ci-only-password \
            gradle --no-daemon assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: snap-go-operator-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
