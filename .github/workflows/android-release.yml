name: Signed Android release
on:
  workflow_dispatch:
jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Prepare signing key
        env:
          KEYSTORE: ${{ secrets.SNAP_GO_SIGNING_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.SNAP_GO_SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/snapgo-release.jks"
          chmod 600 "$RUNNER_TEMP/snapgo-release.jks"
          echo "SNAP_GO_KEYSTORE_FILE=$RUNNER_TEMP/snapgo-release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK
        working-directory: android
        env:
          SNAP_GO_SIGNING_PASSWORD: ${{ secrets.SNAP_GO_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify signed APK and publish public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          test "$version" = "$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -1)"
          apk="android/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          cp "$apk" "SnapGo-Operator-v${version}.apk"
          sha256sum "SnapGo-Operator-v${version}.apk" > SHA256SUMS.txt
          gh release create "v${version}" "SnapGo-Operator-v${version}.apk" SHA256SUMS.txt \
            --title "Snap Go v${version}" --notes "Signed Android operator. Install matching Pi software. Test hardware safely before rover use." --latest
      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/snapgo-release.jks"
