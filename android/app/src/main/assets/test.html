<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Snap Go Test</title><style>
*{box-sizing:border-box}body{font-family:system-ui,sans-serif;background:#0c141b;color:#e6eef2;margin:0;padding:9px}header,.toolbar,.controls{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}header h1{font-size:17px;margin:0}.badge{background:#27494c;color:#91ffdd;border:1px solid #4a8d7e;padding:5px 9px;border-radius:20px;font-size:11px}p,.sub{font-size:11px;color:#a7bcc6;margin:6px 0}.console{display:grid;grid-template-columns:minmax(60px,1fr) minmax(148px,4fr) minmax(60px,1fr);gap:5px;margin-top:9px}.side,.center,.panel{background:#13212b;border:1px solid #2a3c47;border-radius:10px;padding:7px}.side{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.side strong{font-size:12px}.side small{color:#9bb2bf;font-size:9px;margin:5px 0}.stick{width:min(100%,155px);aspect-ratio:1;border:2px solid #42616e;border-radius:50%;background:#0c1922;position:relative;touch-action:none;user-select:none}.stick::after{content:'';position:absolute;background:#67dfbc;width:35%;height:35%;border-radius:50%;left:var(--x,50%);top:var(--y,50%);transform:translate(-50%,-50%);box-shadow:0 2px 10px #0009}.center canvas{width:100%;height:auto;background:#081017;border-radius:7px;display:block}.toolbar{margin:8px 0}.panel{margin-top:9px}.controls{justify-content:flex-start}button,select{border:0;border-radius:7px;background:#22404b;color:#e6eef2;padding:9px 12px;font:inherit;font-size:12px}button.active{background:#67dfbc;color:#112b27}button.stop{background:#f29c94;color:#35130f}output{font-size:11px;color:#67dfbc}.status{font-size:12px;color:#b8d5d9;margin-top:7px}@media(max-width:390px){.console{grid-template-columns:55px minmax(145px,1fr) 55px}.side{padding:3px}.side strong{font-size:10px}}
</style></head><body><header><h1>Snap Go · Test</h1><span class="badge">OFFLINE SIMULATION</span></header><p>Virtual camera and synthetic detections. Test mode never connects to the Pi or moves servos. For physical pan/tilt and YOLO detection, use Live.</p>
<div class="toolbar"><span id="detect" class="badge">Detection on</span><span id="position">Pan 1500 · Tilt 1500 µs (virtual)</span></div>
<section class="console"><div class="side"><strong>PAN</strong><small>Left ↔ right</small><div id="panStick" class="stick" role="slider" aria-label="Virtual pan joystick" aria-valuenow="0"></div><output id="panValue">1500</output></div><div class="center"><canvas id="scene" width="640" height="480" aria-label="Synthetic camera scene"></canvas></div><div class="side"><strong>TILT</strong><small>Up ↕ down</small><div id="tiltStick" class="stick" role="slider" aria-label="Virtual tilt joystick" aria-valuenow="0"></div><output id="tiltValue">1500</output></div></section>
<section class="panel"><div class="controls"><button id="manual" class="active">Manual</button><button id="track">Track sample target</button><button id="toggleDetection">Detection off</button><button id="center">Center</button><button id="reset" class="stop">Reset test</button><select id="sample" aria-label="Sample object"><option value="person">Sample person</option><option value="ball">Sample ball</option></select></div><div id="status" class="status" role="status">Manual virtual pan/tilt ready.</div></section>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('scene'),ctx=canvas.getContext('2d');let pan=1500,tilt=1500,tracking=false,detect=true,phase=0,last=performance.now();const axis={pan:{el:$('panStick'),value:0,id:null},tilt:{el:$('tiltStick'),value:0,id:null}};
function clamp(x,lo,hi){return Math.max(lo,Math.min(hi,x));}
function setAxis(name,e){const a=axis[name],r=a.el.getBoundingClientRect(),offset=name==='pan'?e.clientX-r.left-r.width/2:r.top+r.height/2-e.clientY;const v=clamp(offset/(r.width*.33),-1,1);a.value=Math.abs(v)<.12?0:v;a.el.style.setProperty(name==='pan'?'--x':'--y',(50+(name==='pan'?1:-1)*a.value*32)+'%');a.el.setAttribute('aria-valuenow',String(Math.round(a.value*100)));}
function release(name){const a=axis[name];a.value=0;a.id=null;a.el.style.setProperty(name==='pan'?'--x':'--y','50%');a.el.setAttribute('aria-valuenow','0');}
for(const name of Object.keys(axis)){const a=axis[name];a.el.addEventListener('pointerdown',e=>{e.preventDefault();a.id=e.pointerId;a.el.setPointerCapture(e.pointerId);setAxis(name,e)});a.el.addEventListener('pointermove',e=>{if(a.id===e.pointerId)setAxis(name,e)});for(const ev of ['pointerup','pointercancel','lostpointercapture'])a.el.addEventListener(ev,e=>{if(a.id===e.pointerId)release(name)})}
function mode(track){tracking=track;$('manual').classList.toggle('active',!track);$('track').classList.toggle('active',track);$('status').textContent=track?'Synthetic target tracking active. Joysticks paused.':'Manual virtual pan/tilt ready.';}
$('manual').onclick=()=>mode(false);$('track').onclick=()=>mode(true);$('toggleDetection').onclick=()=>{detect=!detect;$('toggleDetection').textContent=detect?'Detection off':'Detection on';$('detect').textContent=detect?'Detection on':'Detection off';};$('center').onclick=()=>{pan=tilt=1500;};$('reset').onclick=()=>{mode(false);detect=true;$('toggleDetection').textContent='Detection off';$('detect').textContent='Detection on';pan=tilt=1500;phase=0;for(const name of Object.keys(axis))release(name);};
function paint(time){const dt=clamp((time-last)/1000,0,.05);last=time;phase+=dt;const width=canvas.width,height=canvas.height,kind=$('sample').value;const worldX=width*(.5+.25*Math.sin(phase*.7)),worldY=height*(.48+.14*Math.sin(phase*.46));const x=worldX-(pan-1500)*.85,y=worldY+(tilt-1500)*.85;const visible=x>40&&x<width-40&&y>40&&y<height-40;if(tracking){if(detect&&visible){pan=clamp(pan+(x-width/2)*dt*.35,1200,1800);tilt=clamp(tilt-(y-height/2)*dt*.35,1300,1700);}else{$('status').textContent='Sample target out of frame or detection off — holding.';}}else{pan=clamp(pan+axis.pan.value*180*dt,1200,1800);tilt=clamp(tilt+axis.tilt.value*180*dt,1300,1700);}
ctx.fillStyle='#0d1d28';ctx.fillRect(0,0,width,height);ctx.fillStyle='#183243';ctx.fillRect(0,height*.68,width,height*.32);ctx.strokeStyle='#264c57';ctx.lineWidth=1;for(let gx=0;gx<width;gx+=40){ctx.beginPath();ctx.moveTo(gx,0);ctx.lineTo(gx,height);ctx.stroke()}for(let gy=0;gy<height;gy+=40){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(width,gy);ctx.stroke()}
if(visible){if(kind==='person'){ctx.fillStyle='#9fb5c3';ctx.beginPath();ctx.arc(x,y-30,15,0,Math.PI*2);ctx.fill();ctx.fillRect(x-19,y-12,38,52);ctx.fillRect(x-16,y+40,11,38);ctx.fillRect(x+5,y+40,11,38)}else{ctx.fillStyle='#f5a16b';ctx.beginPath();ctx.arc(x,y,27,0,Math.PI*2);ctx.fill()}if(detect){const halfW=kind==='person'?27:33,halfH=kind==='person'?90:33;ctx.strokeStyle='#67dfbc';ctx.lineWidth=3;ctx.strokeRect(x-halfW,y-(kind==='person'?52:halfH),halfW*2,halfH*2);ctx.fillStyle='#67dfbc';ctx.font='16px sans-serif';ctx.fillText(kind+' · simulated 0.94',clamp(x-halfW,8,width-210),clamp(y-(kind==='person'?65:47),20,height-8));}}
ctx.strokeStyle='#67dfbc';ctx.beginPath();ctx.moveTo(width/2-15,height/2);ctx.lineTo(width/2+15,height/2);ctx.moveTo(width/2,height/2-15);ctx.lineTo(width/2,height/2+15);ctx.stroke();$('position').textContent='Pan '+Math.round(pan)+' · Tilt '+Math.round(tilt)+' µs (virtual)';$('panValue').textContent=Math.round(pan);$('tiltValue').textContent=Math.round(tilt);requestAnimationFrame(paint)}requestAnimationFrame(paint);
</script></body></html>
